# Use C-a as prefix (or keep C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Better splitting (| and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Start windows/panes at current directory
bind c new-window -c "#{pane_current_path}"

# Enable mouse, true color, faster escape
set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# History and numbering
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vi-style keys in copy mode
setw -g mode-keys vi

# Status bar
set -g status-interval 5
set -g status-right "#H | %Y-%m-%d %H:%M"

# Bold window tabs
setw -g window-status-style "bold"
setw -g window-status-current-style "bold,fg=black,bg=colour214"   # bold, dark text on orange





# Pane navigation with hjkl (no prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Copy selection straight to the system clipboard
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

